case_settings:
    integrator: 'euler' # 'euler' | 'body' | 'zero_gravity' | 'billiard'
    acceleration_model: 'einsum' # 'einsum' | 'numexpr' | 'cycles'

    gravitational_constant: 6.67e-11
    end_time: 500_000
    write_period: 100
    enable_3d: False
    custom_time_step: 10
    draw_every: 5

    calculate_barycenter: True
    barycenter_reference_frame: True
    calculate_energy: False
    calculate_da_a_ratio: False
    softening: 0
    save_acceleration_matrix: false
    elasticity: 1
