case_settings:
    integrator: 'billiard' # 'euler' | 'body' | 'zero_gravity' | 'billiard'
    acceleration_model: 'numba' # 'einsum' | 'numexpr' | 'numba' | 'cycles'
    
    gravitational_constant: 6.67e-11
    end_time: 200
    write_period: 1
    enable_3d: False
    custom_time_step: 0.1
    draw_every: 1

    calculate_barycenter: False
    barycenter_reference_frame: False
    calculate_energy: False
    calculate_da_a_ratio: False
    softening: 0
    save_acceleration_matrix: false
    elasticity: 1
